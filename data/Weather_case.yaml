    city: ""
    future_num: 5
    expect:
      reason: "城市不能为空或暂不支持该城市"   # 贴实际返回

  - case_id: NEG_002
    city: "不存在的城市XYZ"
    future_num: 5
    expect:
      reason: "暂不支持该城市"                # 贴实际返回